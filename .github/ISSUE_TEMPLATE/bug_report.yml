name: Bug reproducible
description: Algo no funciona y puedes describir cómo reproducirlo.
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        No incluyas cookies, tokens, contraseñas ni capturas con datos privados.
  - type: input
    id: version
    attributes:
      label: Versión
      placeholder: WebClone Ultimate 1.2.0
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Navegador
      options: [Chrome, Chromium, Edge, Firefox, Otro]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abrir...
        2. Pulsar...
        3. Ver...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado real
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Informe o captura del inspector
      description: Pega solo fragmentos saneados de capture-report.json.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: He eliminado cookies, tokens y datos personales del reporte.
          required: true
