version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      extension-dev:
        patterns: ['*']
        dependency-type: development

  - package-ecosystem: npm
    directory: '/website'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      website:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
