name: External compatibility tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  external:
    name: protocolexplorer.org · Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep "protocolexplorer"
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-e2e-reports
          path: reports/out
          retention-days: 14
